<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirFountainZulu Web</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #10141D; }
        #ComposeTarget { width: 100%; height: 100%; outline: none; touch-action: none; cursor: default; }
    </style>
</head>
<body>
<canvas id="ComposeTarget"></canvas>
<script>
// AirFountainZulu 浏览器桥：文件选择/下载/摄像头二维码检测（window.AFZ）。
// Kotlin 侧（JsBridge.kt）以同步轮询方式取结果，避免 Promise 互操作。
window.AFZ = (function () {
    var pickState = 0, pickData = null, pickName = null; // pickState: 0空闲 1等待 2已读取 3取消
    var camStream = null, camVideo = null, camTimer = 0, lastFrame = null, camErrorText = '';
    var detector = null;

    function bytesToB64(bytes) {
        var bin = '';
        var CHUNK = 0x8000;
        for (var i = 0; i < bytes.length; i += CHUNK) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CHUNK, bytes.length)));
        }
        return btoa(bin);
    }

    function b64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    function startPick() {
        pickState = 1; pickData = null; pickName = null;
        var input = document.createElement('input');
        input.type = 'file';
        input.onchange = function () {
            if (!input.files || !input.files.length) { pickState = 3; return; }
            var f = input.files[0];
            pickName = f.name;
            var r = new FileReader();
            r.onload = function () {
                try {
                    pickData = bytesToB64(new Uint8Array(r.result));
                    pickState = 2;
                } catch (e) { pickState = 3; }
            };
            r.onerror = function () { pickState = 3; };
            r.readAsArrayBuffer(f);
        };
        input.click();
    }

    function takePicked() {
        if (pickState === 2) { pickState = 0; var d = pickData; pickData = null; return d; }
        if (pickState === 3) { pickState = 0; return ''; }
        return null;
    }

    function pickedName() { return pickName; }

    function download(b64, name) {
        try {
            var url = URL.createObjectURL(new Blob([b64ToBytes(b64)]));
            var a = document.createElement('a');
            a.href = url; a.download = name || 'file.bin';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        } catch (e) { camErrorText = '下载失败：' + e; }
    }

    function startCam() {
        camErrorText = '';
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            camErrorText = '当前环境不支持摄像头（需 https 或 localhost）'; return;
        }
        if (!window.BarcodeDetector) {
            camErrorText = '浏览器不支持 BarcodeDetector，请使用 Chrome/Edge'; return;
        }
        try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); }
        catch (e) { camErrorText = 'BarcodeDetector 初始化失败：' + e; return; }
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
        }).then(function (stream) {
            camStream = stream;
            camVideo = document.createElement('video');
            camVideo.srcObject = stream;
            camVideo.muted = true;
            camVideo.setAttribute('playsinline', 'true');
            camVideo.style.cssText = 'position:fixed;right:6px;bottom:6px;width:160px;height:120px;object-fit:cover;z-index:9999;border:1px solid #3D8BFF;border-radius:6px;opacity:0.85;';
            document.body.appendChild(camVideo);
            return camVideo.play();
        }).then(function () {
            camTimer = setInterval(detectLoop, 30);
        }).catch(function (e) {
            camErrorText = '摄像头打开失败：' + (e && e.message ? e.message : e);
            stopCam();
        });
    }

    function detectLoop() {
        if (!detector || !camVideo || camVideo.readyState < 2) return;
        detector.detect(camVideo).then(function (codes) {
            if (codes && codes.length && codes[0].rawValue) {
                var raw = codes[0].rawValue;
                var bytes = new Uint8Array(raw.length);
                for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i) & 0xFF;
                lastFrame = bytesToB64(bytes);
            }
        }).catch(function () { /* 单帧失败忽略 */ });
    }

    function stopCam() {
        if (camTimer) { clearInterval(camTimer); camTimer = 0; }
        if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
        if (camVideo) { camVideo.remove(); camVideo = null; }
        lastFrame = null;
    }

    function takeFrame() { var f = lastFrame; lastFrame = null; return f === undefined ? null : f; }
    function camErr() { var e = camErrorText; camErrorText = ''; return e ? e : null; }

    return {
        startPick: startPick, takePicked: takePicked, pickedName: pickedName,
        download: download, startCam: startCam, stopCam: stopCam,
        takeFrame: takeFrame, camErr: camErr,
    };
})();
</script>
<script src="skiko.js"></script>
<script src="composeApp.js"></script>
</body>
</html>
